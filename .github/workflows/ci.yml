name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Retired-agent provenance tests use a pinned historical commit.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Validate repository
        run: python tools/validate.py
      - name: Render generated artifacts
        run: python tools/render.py
      - name: Check Markdown links
        run: python tools/check_links.py
      - name: Run negative validation tests
        run: python tools/test_validate.py
      - name: Run SDD contract tests
        run: python tools/test_sdd_contract.py
      - name: Run model-guidance removal and feature-level contract tests
        run: python tools/test_model_recommendations.py
      - name: Run Code Review contract tests
        run: python tools/test_code_review_contract.py
      - name: Run Antigravity distribution contract tests
        run: python tools/test_antigravity_contract.py
      - name: Run handoff contract tests
        run: python tools/test_handoff_contract.py
      - name: Run documentation core contracts
        run: python tools/test_documentation_core.py
      - name: Run safe retired-agent migration tests
        run: python tools/test_retired_agents.py
      - name: Run link checker tests
        run: python tools/test_links.py
      - name: Run integrity tests
        run: python tools/test_integrity.py
      - name: Check shell script syntax
        run: |
          for script in scripts/install/*.sh scripts/backup/*.sh; do
            bash -n "$script"
          done
      - name: Run installer tests
        run: python tools/test_install.py
      - name: Run native Antigravity installer and export tests
        run: python tools/test_antigravity_install.py
      - name: Verify generated artifacts are committed
        run: git diff --exit-code -- generated/

  antigravity-install:
    name: Antigravity native install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Validate distribution
        run: python tools/validate.py
      - name: Run native installer and export tests in temporary profiles
        run: python tools/test_antigravity_install.py
